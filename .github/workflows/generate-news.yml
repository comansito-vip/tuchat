name: Generar noticias

# Ejecuta el pipeline multi-LLM de noticias a diario y commitea el resultado.
# Requiere el secret ANTHROPIC_API_KEY (y opcionalmente OPENAI_API_KEY como fallback).
on:
  schedule:
    - cron: "0 5 * * *" # 05:00 UTC cada día
  workflow_dispatch: {} # permite lanzarlo a mano

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generar noticias
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run generate:news

      - name: Commitear cambios
        run: |
          if [[ -n "$(git status --porcelain src/data/news.ts)" ]]; then
            git config user.name "tuchat-bot"
            git config user.email "bot@tuchat.org"
            git add src/data/news.ts
            git commit -m "chore: regenerar noticias diarias"
            git push
          else
            echo "Sin cambios en news.ts"
          fi
