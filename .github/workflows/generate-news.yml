name: Generar noticias

# Ejecuta el pipeline multi-LLM de noticias a diario y commitea el resultado.
# Preferentemente ANTHROPIC_API_KEY/OPENAI_API_KEY (mejor calidad); si no están, cae
# en la cadena de proveedores gratuitos (Groq/Cerebras/Mistral/NVIDIA/Gemini) para que
# el cron nunca se quede sin generar nada por falta de una clave de pago.
#
# Los secrets *_API_KEYS admiten varias claves separadas por comas y se rotan. Se
# repusieron el 2026-08-06 tras comprobar una a una cuáles seguían respondiendo:
# `node scripts/check-llm-providers.mjs` repite esa comprobación cuando haga falta.
on:
  schedule:
    - cron: "0 5 * * *" # 05:00 UTC cada día
  workflow_dispatch: {} # permite lanzarlo a mano

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generar noticias
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          CEREBRAS_API_KEYS: ${{ secrets.CEREBRAS_API_KEYS }}
          NVIDIA_API_KEYS: ${{ secrets.NVIDIA_API_KEYS }}
          COHERE_API_KEYS: ${{ secrets.COHERE_API_KEYS }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          MISTRAL_API_KEYS: ${{ secrets.MISTRAL_API_KEYS }}
          OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
          HUGGINGFACE_API_KEYS: ${{ secrets.HUGGINGFACE_API_KEYS }}
        run: npm run generate:news

      # Va aquí, encadenada y no en un cron aparte, por dos motivos. Uno: el
      # momento en que el contenido puede haberse degradado es justo el que
      # acaba de pasar, así que se cura lo recién escrito. Dos: el checkout del
      # VPS se sincroniza con `git reset --hard origin/main` en cada deploy y no
      # tiene credenciales de push, de modo que un cron de curación allí
      # perdería su commit; aquí el workflow ya tiene permiso de escritura.
      # `continue-on-error`: la curación sale con 1 cuando la auditoría deja
      # avisos que necesitan criterio humano. Eso es información, no un fallo
      # del pipeline, y no debe impedir que se publiquen las noticias del día.
      - name: Curar contenido (duplicados, muletillas, auditoría)
        continue-on-error: true
        run: npm run curar

      # Va entre la curación y el commit porque el 2026-08-06 este workflow publicó
      # un news.ts sin ninguna noticia destacada: la deduplicación retiró la que lo
      # era y la home se quedó sin bloque principal. data.test.ts lo detecta ("exactly
      # one news article is featured"), pero nadie lo estaba ejecutando aquí. Sin
      # continue-on-error a propósito: si el contenido generado rompe una regla del
      # sitio, es mejor quedarse sin noticias del día que commitearlas rotas.
      - name: Verificar el contenido generado
        run: npm test

      # El push va con rebase y reintento porque el 2026-08-05 este paso falló y se
      # perdió la generación entera de ese día: el job tarda ~15 minutos y basta un
      # push cualquiera en main durante ese rato para que el remoto avance y el push
      # del bot sea rechazado. El rebase es seguro aquí — el commit solo toca
      # src/data y no hay nada más que conservar en un checkout de CI.
      - name: Commitear cambios
        run: |
          if [[ -z "$(git status --porcelain src/data)" ]]; then
            echo "Sin cambios en src/data"
            exit 0
          fi
          git config user.name "tuchat-bot"
          git config user.email "bot@tuchat.org"
          git add src/data
          git commit -m "chore: noticias diarias y curación de contenido"

          for intento in 1 2 3; do
            if git push; then
              echo "push OK (intento $intento)"
              exit 0
            fi
            echo "push rechazado; rebase sobre origin/main y reintento"
            git pull --rebase origin main
          done
          echo "::error::el push siguió fallando tras 3 intentos; las noticias del día no se han publicado"
          exit 1
