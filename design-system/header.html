<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#F8FAFC;margin:0;padding:0;-webkit-font-smoothing:antialiased}
header{background:#fff;border-bottom:1px solid #E2E8F0;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:20px;font-weight:800;color:#1E3A8A;text-decoration:none;display:flex;align-items:center;gap:6px}
.logo span{color:#2563EB}
nav{display:flex;align-items:center;gap:4px}
nav a{font-size:13px;font-weight:500;color:#475569;text-decoration:none;padding:6px 10px;border-radius:6px}
nav a:hover{background:#F1F5F9;color:#0F172A}
.cta{background:#2563EB;color:#fff !important;font-weight:600 !important;border-radius:8px;padding:7px 14px !important}
.cta:hover{background:#1d4ed8 !important}
.page{padding:24px;color:#94A3B8;font-size:13px;text-align:center;margin-top:40px}
</style></head><body>
<header>
  <a class="logo" href="#"><span>Tu</span>Chat</a>
  <nav>
    <a href="#">Chat</a>
    <a href="#">Países</a>
    <a href="#">Ciudades</a>
    <a href="#">Temáticas</a>
    <a href="#">Noticias</a>
    <a href="#">Ranking</a>
    <a href="#">Tiempo</a>
    <a href="#">Horóscopo</a>
    <a href="#">Loterías</a>
    <a href="#" class="cta">Entrar al chat</a>
  </nav>
</header>
<div class="page">Header sticky · z-40 · bg-card border-b border-line</div>
</body></html>
