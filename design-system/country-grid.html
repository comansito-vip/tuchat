<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#F8FAFC;padding:24px;-webkit-font-smoothing:antialiased}
.sections{display:flex;flex-direction:column;gap:16px}
.section h3{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#94A3B8;margin:0 0 8px}
.cards{display:flex;gap:8px;flex-wrap:wrap}
.card{background:#fff;border:1px solid #E2E8F0;border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:8px;cursor:pointer;text-decoration:none;transition:.15s}
.card:hover{border-color:#BFDBFE;background:#EFF6FF}
.card span{font-size:18px}
.card strong{font-size:13px;font-weight:600;color:#0F172A}
</style></head><body>
<div class="sections">
  <div class="section">
    <h3>España</h3>
    <div class="cards">
      <a class="card" href="#"><span>🇪🇸</span><strong>España</strong></a>
    </div>
  </div>
  <div class="section">
    <h3>Latinoamérica</h3>
    <div class="cards">
      <a class="card" href="#"><span>🇲🇽</span><strong>México</strong></a>
      <a class="card" href="#"><span>🇦🇷</span><strong>Argentina</strong></a>
      <a class="card" href="#"><span>🇨🇴</span><strong>Colombia</strong></a>
      <a class="card" href="#"><span>🇨🇱</span><strong>Chile</strong></a>
      <a class="card" href="#"><span>🇵🇪</span><strong>Perú</strong></a>
    </div>
  </div>
  <div class="section">
    <h3>Europa</h3>
    <div class="cards">
      <a class="card" href="#"><span>🇫🇷</span><strong>Francia</strong></a>
      <a class="card" href="#"><span>🇮🇹</span><strong>Italia</strong></a>
      <a class="card" href="#"><span>🇵🇹</span><strong>Portugal</strong></a>
    </div>
  </div>
</div>
</body></html>
