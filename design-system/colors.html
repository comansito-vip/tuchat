<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif;background:#F8FAFC;color:#475569;padding:24px;-webkit-font-smoothing:antialiased}
h2{font-size:16px;font-weight:700;color:#0F172A;margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.swatch{border-radius:10px;height:60px;border:1px solid rgba(0,0,0,.06)}
.label{font-size:11px;margin-top:6px;line-height:1.5}
.name{font-weight:600;color:#0F172A}
</style></head><body>
<h2>Paleta de color — TuChat</h2>
<div class="grid">
  <div><div class="swatch" style="background:#F8FAFC;border-color:#E2E8F0"></div><div class="label"><span class="name">bg</span><br>#F8FAFC</div></div>
  <div><div class="swatch" style="background:#FFFFFF;border-color:#E2E8F0"></div><div class="label"><span class="name">card</span><br>#FFFFFF</div></div>
  <div><div class="swatch" style="background:#2563EB"></div><div class="label"><span class="name">blue</span><br>#2563EB</div></div>
  <div><div class="swatch" style="background:#1E3A8A"></div><div class="label"><span class="name">blue-dark</span><br>#1E3A8A</div></div>
  <div><div class="swatch" style="background:#0F172A"></div><div class="label"><span class="name">ink</span><br>#0F172A</div></div>
  <div><div class="swatch" style="background:#475569"></div><div class="label"><span class="name">muted</span><br>#475569</div></div>
  <div><div class="swatch" style="background:#E2E8F0;border-color:#CBD5E1"></div><div class="label"><span class="name">line</span><br>#E2E8F0</div></div>
  <div><div class="swatch" style="background:#22C55E"></div><div class="label"><span class="name">active</span><br>#22C55E</div></div>
</div>
</body></html>
