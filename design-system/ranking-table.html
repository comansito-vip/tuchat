<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#F8FAFC;padding:24px;-webkit-font-smoothing:antialiased}
.card{background:#fff;border:1px solid #E2E8F0;border-radius:12px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px}
thead tr{border-bottom:1px solid #E2E8F0}
th{padding:10px 14px;text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#94A3B8}
td{padding:10px 14px;border-top:1px solid #E2E8F0;color:#475569}
.pos{display:inline-flex;width:24px;height:24px;align-items:center;justify-content:center;border-radius:50%;font-size:11px;font-weight:700}
.gold{background:#FEF3C7;color:#92400e}
.num{color:#94A3B8;font-size:13px}
.name{display:flex;align-items:center;gap:8px;font-weight:600;color:#0F172A}
.dot{width:7px;height:7px;border-radius:50%;background:#22C55E;display:inline-block;margin-right:4px}
.entrar{color:#2563EB;font-weight:600;text-decoration:none}
</style></head><body>
<div class="card">
<table>
  <thead><tr>
    <th>Posición</th><th>Sala</th><th>País/Tema</th><th>Actividad</th><th></th>
  </tr></thead>
  <tbody>
    <tr><td style="text-align:center"><span class="pos gold">1</span></td><td><span class="name">🇪🇸 España</span></td><td>País</td><td><span class="dot"></span>Alta</td><td><a class="entrar" href="#">Entrar</a></td></tr>
    <tr><td style="text-align:center"><span class="pos gold">2</span></td><td><span class="name">🏙️ Madrid</span></td><td>España</td><td><span class="dot"></span>Alta</td><td><a class="entrar" href="#">Entrar</a></td></tr>
    <tr><td style="text-align:center"><span class="pos gold">3</span></td><td><span class="name">🇲🇽 México</span></td><td>País</td><td><span class="dot"></span>Alta</td><td><a class="entrar" href="#">Entrar</a></td></tr>
    <tr><td style="text-align:center"><span class="num">4</span></td><td><span class="name">❤️ Amor</span></td><td>Temática</td><td><span class="dot"></span>Alta</td><td><a class="entrar" href="#">Entrar</a></td></tr>
    <tr><td style="text-align:center"><span class="num">5</span></td><td><span class="name">🤝 Amistad</span></td><td>Temática</td><td><span class="dot"></span>Alta</td><td><a class="entrar" href="#">Entrar</a></td></tr>
  </tbody>
</table>
</div>
</body></html>
