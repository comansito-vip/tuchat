<!-- @dsCard group="Primitives" -->
<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif;background:#F8FAFC;padding:24px;-webkit-font-smoothing:antialiased}
h3{font-size:11px;font-weight:600;color:#94A3B8;text-transform:uppercase;letter-spacing:.06em;margin:20px 0 10px}
h3:first-child{margin-top:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:600;padding:8px 18px;border-radius:8px;cursor:pointer;border:none;font-family:inherit;transition:.15s}
.primary{background:#2563EB;color:#fff}
.primary:hover{background:#1d4ed8}
.secondary{background:#EFF6FF;color:#2563EB;border:1px solid #BFDBFE}
.ghost{background:transparent;color:#2563EB}
.sm{font-size:12px;padding:6px 14px}
.lg{font-size:15px;padding:10px 22px}
.disabled{opacity:.5;cursor:not-allowed}
</style></head><body>
<h3>Primary</h3>
<div class="row">
  <button class="btn primary sm">Pequeño</button>
  <button class="btn primary">Entrar al chat</button>
  <button class="btn primary lg">Entrar al chat</button>
  <button class="btn primary disabled" disabled>Deshabilitado</button>
</div>
<h3>Secondary</h3>
<div class="row">
  <button class="btn secondary sm">Ver todas</button>
  <button class="btn secondary">Ver salas</button>
  <button class="btn secondary lg">Explorar países</button>
</div>
<h3>Ghost</h3>
<div class="row">
  <button class="btn ghost sm">Cancelar</button>
  <button class="btn ghost">Más información</button>
</div>
</body></html>
