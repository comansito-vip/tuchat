<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#F8FAFC;padding:24px;-webkit-font-smoothing:antialiased}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.card{background:#fff;border:1px solid #E2E8F0;border-radius:12px;padding:16px 12px;text-align:center;cursor:pointer;text-decoration:none;transition:.15s;display:flex;flex-direction:column;align-items:center;gap:6px}
.card:hover{border-color:#BFDBFE;background:#EFF6FF}
.card span.icon{font-size:26px}
.card strong{font-size:12px;font-weight:600;color:#0F172A;display:block}
.card small{font-size:10px;color:#94A3B8}
.badge{font-size:9px;font-weight:600;background:#DBEAFE;color:#1d4ed8;padding:1px 6px;border-radius:9999px}
.tend{background:#FEF3C7;color:#92400e}
</style></head><body>
<div class="grid">
  <a class="card" href="#"><span class="icon">❤️</span><strong>Amor</strong><span class="badge">Popular</span></a>
  <a class="card" href="#"><span class="icon">🤝</span><strong>Amistad</strong><span class="badge">Popular</span></a>
  <a class="card" href="#"><span class="icon">⚽</span><strong>Deportes</strong><span class="badge">Popular</span></a>
  <a class="card" href="#"><span class="icon">🎮</span><strong>Videojuegos</strong><span class="badge tend">Tendencia</span></a>
  <a class="card" href="#"><span class="icon">🎵</span><strong>Música</strong><span class="badge tend">Tendencia</span></a>
  <a class="card" href="#"><span class="icon">🎬</span><strong>Cine</strong><small>295 usuarios</small></a>
  <a class="card" href="#"><span class="icon">💻</span><strong>Tecnología</strong><small>340 usuarios</small></a>
  <a class="card" href="#"><span class="icon">✈️</span><strong>Viajes</strong><span class="badge tend">Tendencia</span></a>
  <a class="card" href="#"><span class="icon">🍳</span><strong>Cocina</strong><small>260 usuarios</small></a>
  <a class="card" href="#"><span class="icon">🏃</span><strong>Salud</strong><small>195 usuarios</small></a>
</div>
</body></html>
