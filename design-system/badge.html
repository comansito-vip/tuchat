<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif;background:#F8FAFC;padding:24px;-webkit-font-smoothing:antialiased}
.row{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:2px 8px;border-radius:9999px}
.popular{background:#DBEAFE;color:#1d4ed8}
.nueva{background:#DCFCE7;color:#15803d}
.tendencia{background:#FEF3C7;color:#92400e}
.label{font-size:11px;color:#94A3B8;width:80px}
</style></head><body>
<div class="row"><span class="label">Popular</span><span class="badge popular">Popular</span></div>
<div class="row"><span class="label">Nueva</span><span class="badge nueva">Nueva</span></div>
<div class="row"><span class="label">Tendencia</span><span class="badge tendencia">Tendencia</span></div>
</body></html>
