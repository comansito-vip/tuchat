<!-- @dsCard group="Home" -->
<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif;background:#F8FAFC;padding:24px;display:flex;gap:12px;flex-wrap:wrap;-webkit-font-smoothing:antialiased}
.card{background:#fff;border:1px solid #E2E8F0;border-radius:12px;padding:14px;width:160px;display:flex;flex-direction:column;gap:8px}
.top{display:flex;align-items:center;justify-content:space-between}
.icon{font-size:22px}
.badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:9999px}
.pop{background:#DBEAFE;color:#1d4ed8}
.tend{background:#FEF3C7;color:#92400e}
.name{font-size:14px;font-weight:700;color:#0F172A}
.stats{font-size:11px;color:#475569;display:flex;align-items:center;gap:4px}
.dot{width:7px;height:7px;border-radius:50%;background:#22C55E;display:inline-block}
.btn{margin-top:4px;background:#2563EB;color:#fff;font-size:12px;font-weight:600;border:none;border-radius:6px;padding:6px 0;cursor:pointer;font-family:inherit;width:100%}
</style></head><body>
<div class="card">
  <div class="top"><span class="icon">🇪🇸</span><span class="badge pop">Popular</span></div>
  <div class="name">España</div>
  <div class="stats"><span class="dot"></span>1.240 hablando · 1.980 votos</div>
  <button class="btn">Entrar</button>
</div>
<div class="card">
  <div class="top"><span class="icon">❤️</span><span class="badge pop">Popular</span></div>
  <div class="name">Amor</div>
  <div class="stats"><span class="dot"></span>640 hablando · 980 votos</div>
  <button class="btn">Entrar</button>
</div>
<div class="card">
  <div class="top"><span class="icon">🎮</span><span class="badge tend">Tendencia</span></div>
  <div class="name">Videojuegos</div>
  <div class="stats"><span class="dot"></span>375 hablando · 590 votos</div>
  <button class="btn">Entrar</button>
</div>
<div class="card">
  <div class="top"><span class="icon">🏙️</span></div>
  <div class="name">Madrid</div>
  <div class="stats"><span class="dot"></span>920 hablando · 1.450 votos</div>
  <button class="btn">Entrar</button>
</div>
</body></html>
